plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        // Three local players plus a dedicated server for testing interactions between players.
        // Each client opens at 1280x720 so all three fit on one screen (see scripts/arrange-windows.ps1).
        server {
            server()
            gameDirectory = project.file('run-neo/server')
            programArgument '--nogui'
        }
        client {
            client()
            gameDirectory = project.file('run-neo/client')
            programArguments.addAll '--username', 'Dev', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        client2 {
            client()
            gameDirectory = project.file('run-neo/client2')
            programArguments.addAll '--username', 'Dev2', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        client3 {
            client()
            gameDirectory = project.file('run-neo/client3')
            programArguments.addAll '--username', 'Dev3', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // The game is not on the plain unit-test classpath; TogetherConfig needs the Gson that Minecraft 1.21.1 ships.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
